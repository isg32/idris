name: Build and release

# Builds signed APKs (one per ABI) and the Linux AppImage on every push to
# main and publishes them as a GitHub release tagged v<version>-<short sha>,
# with update.json, which
# installed copies of Idris read to update themselves (lib/platform/updater.dart).
# Bump the version in pubspec.yaml on every push: a release whose
# versionCode isn't above the last one is refused.
#
# No keystore is committed. It comes from the IDRIS_KEYSTORE_BASE64
# secret (`base64 -w0 release-key.jks`), is decoded into the runner's temp
# folder for the build, and android/app/build.gradle.kts reads it through
# the IDRIS_* variables, the same way build_signed.sh does locally.
#
# Secrets (in the "deployment" environment): IDRIS_KEYSTORE_BASE64,
# IDRIS_KEYSTORE_PASSWORD, IDRIS_KEY_PASSWORD and, optionally,
# IDRIS_KEY_ALIAS (defaults to "upload").

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # The Linux app as one file (linux/build_appimage.sh): the Flutter build,
  # the NewPipe helper with a trimmed Java runtime, and libmpv.
  appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Install the Linux build requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev file

      - run: flutter pub get

      - name: Build the AppImage
        run: linux/build_appimage.sh build/appimage

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: build/appimage/Idris-x86_64.AppImage
          if-no-files-found: error

  build-and-release:
    needs: appimage
    runs-on: ubuntu-latest
    environment: deployment
    steps:
      # The whole history and tags: the update's notes list the commits since
      # the last release.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          {
            echo 'MESSAGE<<EOM'
            git log -1 --format='%s'
            echo 'EOM'
          } >> "$GITHUB_OUTPUT"

      - name: Decode the release keystore
        env:
          IDRIS_KEYSTORE_BASE64: ${{ secrets.IDRIS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$IDRIS_KEYSTORE_BASE64" ]; then
            echo "IDRIS_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          printf '%s' "$IDRIS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-key.jks"

      - run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build signed APKs
        env:
          IDRIS_KEYSTORE_FILE: ${{ runner.temp }}/release-key.jks
          IDRIS_KEYSTORE_PASSWORD: ${{ secrets.IDRIS_KEYSTORE_PASSWORD }}
          IDRIS_KEY_PASSWORD: ${{ secrets.IDRIS_KEY_PASSWORD }}
          IDRIS_KEY_ALIAS: ${{ secrets.IDRIS_KEY_ALIAS }}
        run: flutter build apk --release --split-per-abi

      - name: Check the APKs are signed with the release key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -q "Android Debug" && { echo "Signed with the debug key" >&2; exit 1; } || true

      # update.json is what Idris reads to update itself (lib/platform/updater.dart):
      # each APK's URL, size, SHA-256 and versionCode (read from the APK, since
      # --split-per-abi adds 1000 × the ABI), and the commits since the last
      # release as "What's new".
      - name: Write the update manifest
        env:
          TAG: v${{ steps.version.outputs.VERSION }}-${{ steps.version.outputs.SHA }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPO: ${{ github.repository }}
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="-1"; fi
          git log --no-merges --format='%s' $RANGE > "$RUNNER_TEMP/notes.txt"
          python3 - "$AAPT2" <<'PY'
          import hashlib, json, os, re, subprocess, sys, datetime
          aapt2 = sys.argv[1]
          tag, version, repo = os.environ["TAG"], os.environ["VERSION"], os.environ["REPO"]
          out = "build/app/outputs/flutter-apk"
          apks = {}
          for abi in ("arm64-v8a", "armeabi-v7a", "x86_64"):
              name = f"app-{abi}-release.apk"
              path = f"{out}/{name}"
              badging = subprocess.run([aapt2, "dump", "badging", path],
                                       capture_output=True, text=True, check=True).stdout
              code = int(re.search(r"versionCode='(\d+)'", badging).group(1))
              sha = hashlib.sha256(open(path, "rb").read()).hexdigest()
              apks[abi] = {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "sha256": sha,
                  "size": os.path.getsize(path),
                  "versionCode": code,
              }
          notes = []
          for line in open(os.environ["RUNNER_TEMP"] + "/notes.txt"):
              line = re.sub(r"\s*\(\d+\.\d+\.\d+\)\s*$", "", line.strip())
              if line and line not in notes:
                  notes.append(line)
          manifest = {
              "version": version,
              "build": apks["arm64-v8a"]["versionCode"] % 1000,
              "published": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "notes": notes[:12],
              "apks": apks,
          }
          json.dump(manifest, open(f"{out}/update.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      # A release no phone can install (the version wasn't bumped) would sit
      # there as "latest" and offer nothing: stop instead.
      - name: Check the version went up
        env:
          REPO: ${{ github.repository }}
        run: |
          NEW=$(python3 -c "import json;print(json.load(open('build/app/outputs/flutter-apk/update.json'))['apks']['arm64-v8a']['versionCode'])")
          OLD=$(curl -fsSL "https://github.com/$REPO/releases/latest/download/update.json" 2>/dev/null \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['apks']['arm64-v8a']['versionCode'])" 2>/dev/null || echo 0)
          echo "versionCode $OLD -> $NEW"
          if [ "$NEW" -le "$OLD" ]; then
            echo "versionCode $NEW is not above the last release's $OLD: bump the version in pubspec.yaml" >&2
            exit 1
          fi

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.jks"

      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: build/appimage

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}-${{ steps.version.outputs.SHA }}
          name: Idris ${{ steps.version.outputs.VERSION }}
          make_latest: true
          prerelease: false
          draft: false
          body: |
            **Commit:** ${{ steps.version.outputs.SHA }}
            **Message:** ${{ steps.version.outputs.MESSAGE }}

            For most phones: `app-arm64-v8a-release.apk`. On Linux: `Idris-x86_64.AppImage` (`chmod +x` it, then run it).
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/update.json
            build/appimage/Idris-x86_64.AppImage
